name: Testar conexao Facebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar token e pagina sem publicar nada
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          page_id = os.environ.get("FACEBOOK_PAGE_ID", "")
          token = os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN", "")
          if not page_id or not token:
              sys.exit("Faltam secrets FACEBOOK_PAGE_ID ou FACEBOOK_PAGE_ACCESS_TOKEN.")
          url = "https://graph.facebook.com/v26.0/me?fields=id,name"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as e:
              print("A Meta recusou a consulta (HTTP %s). Verifique validade e permissoes do token." % e.code)
              sys.exit(1)
          except Exception as e:
              print("Falha de rede ou na consulta: %s" % type(e).__name__)
              sys.exit(1)
          if str(data.get("id")) != page_id:
              print("ERRO: O token nao corresponde ao ID da pagina configurada.")
              sys.exit(1)
          print("SUCESSO: Token da pagina validado. Nome:", data.get("name", "(sem nome)"))
          print("Nenhuma publicacao foi criada.")
          PY
