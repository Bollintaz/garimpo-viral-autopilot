name: Montar Reel com cenas IA (previa)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  montar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check "kokoro>=0.9.4,<1" soundfile numpy
      - name: Montar o video apenas com cenas IA fornecidas
        run: python scripts/montar_reel_ia.py
      - name: Disponibilizar preview sem publicar
        uses: actions/upload-artifact@v4
        with:
          name: garimpo-reel-previa
          path: saida/garimpo-reel-previa.mp4
          retention-days: 7
